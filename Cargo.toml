[package]
name = "nvstt"
version = "0.1.0"
edition = "2024"
description = "Local Linux voice dictation daemon and CLI"
license = "MIT"

[features]
default = ["cpu-runtime"]
cpu-runtime = ["sherpa-onnx/static"]
cuda-runtime = ["sherpa-onnx/shared"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cpal = "0.18.1"
bzip2 = { version = "0.4.4", features = ["static"] }
eitype = "0.2.2"
notify-rust = "4.11"
nnnoiseless = { version = "0.5.2", default-features = false }
rubato = "5.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sherpa-onnx = { version = "1.13.4", default-features = false }
text-processing-rs = "0.2.2"
thiserror = "2.0"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "io-util", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "2.12.1"
wrtype = "0.1.0"

[dev-dependencies]
tempfile = "3.20"
