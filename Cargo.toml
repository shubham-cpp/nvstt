[package]
name = "nvstt"
version = "0.1.0"
edition = "2024"
description = "Local Linux voice dictation daemon and CLI"
license = "MIT"

[features]
default = ["cpu-runtime"]
cpu-runtime = ["sherpa-onnx/static"]
cuda-runtime = ["sherpa-onnx/shared"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
ksni = "=0.3.6"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
pulseaudio = "0.3.1"
bzip2 = { version = "0.6.1", default-features = false, features = ["bzip2-sys", "static"] }
eitype = "0.2.2"
notify-rust = "4.11"
nnnoiseless = { version = "0.5.2", default-features = false }
rtrb = "=0.4.0"
rubato = "5.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Decoder window behavior is covered by the native replay regressions.
# Re-run those checks before changing the runtime version.
sherpa-onnx = { version = "=1.13.8", default-features = false }
text-processing-rs = "0.2.2"
thiserror = "2.0.21"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "io-util", "signal", "sync", "time"] }
toml = "1.1.6"
tempfile = "3.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "3.4.2"
wrtype = "0.1.0"
